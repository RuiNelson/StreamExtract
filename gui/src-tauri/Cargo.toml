[package]
name = "StreamExtract"
version = "2.6.0"
description = "Desktop front-end for StreamExtract: uploads the contents of a RAR, ZIP, 7z or tar archive, or exFAT, PFS or UFS image, to an FTP server without extracting it to disk"
authors = ["Rui Nelson"]
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "streamextract_gui_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
github_release_check = "=0.2.1"
semver = "1"
tokio = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "=0.10.0"
uuid = { version = "1", features = ["v4", "serde"] }

# Linux only: pure-Rust D-Bus client (already in the lock file through Tauri) used to take the
# systemd-logind sleep inhibitor lock.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[profile.release]
codegen-units = 1
lto = true
strip = true
