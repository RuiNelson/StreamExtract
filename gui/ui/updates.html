<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>StreamExtract — Updates</title>
  <link rel="stylesheet" href="style.css">
  <script src="updates.js" defer></script>
</head>
<body>
  <main class="update-window">
    <h1 id="update-title">StreamExtract updates</h1>
    <p id="update-text"></p>
    <p id="update-hint" class="muted" hidden>You can change this choice in Advanced.</p>
    <p id="update-error" class="error-text" role="alert" hidden></p>
    <div class="dialog-actions">
      <button type="button" id="update-no" class="btn" disabled>Not now</button>
      <button type="button" id="update-yes" class="btn btn-primary" disabled>Open releases</button>
    </div>
  </main>
</body>
</html>
