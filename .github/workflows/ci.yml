name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  UNRAR_VERSION: "7.3.1"
  UNRAR_SHA256: 634900842a3737d9cc15bbcc71d4c74cc713437e0bca296a573424fe5f2660ab
  LZMASDK_URL: https://github.com/ip7z/7zip/releases/download/26.03/lzma2603.7z
  LZMASDK_SHA256: 86c213f752520ab5325c310f50bef63ec344b56dd1c80b0246d06dc6cec953b2
  FATFS_URL: https://elm-chan.org/fsw/ff/arc/ff16.zip
  FATFS_SHA256: 99f7dc1f7e095356e4a9e3dbe29959090d8b948afe2bbc5441e52fdf4b85449e
  # Only used to create the .rar artifacts (evaluation copy of the RAR archiver).
  RAR_ARCHIVE: rarlinux-x64-723.tar.gz
  RAR_SHA256: 759b4b6aa0d9f77131882162951193f3a0e54bf60e1d8dc4255aa308accab588

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            # Oldest hosted image, for the widest glibc compatibility.
            os: ubuntu-22.04
            exe: sext
            configure: >-
              -G Ninja
              -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          - name: linux-arm64
            # Native arm64 runner, same glibc baseline as linux-x64.
            os: ubuntu-22.04-arm
            exe: sext
            configure: >-
              -G Ninja
              -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          - name: macos-universal
            os: macos-latest
            exe: sext
            configure: >-
              -G Ninja
              "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
              -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          - name: windows-x64
            os: windows-latest
            exe: Release/sext.exe
            # Static CRT: the binary must not need the VC++ redistributable.
            configure: >-
              -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
              -DCURL_STATIC_CRT=ON
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build p7zip-full

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # The UnRAR sources are not part of the repository (see README).
      - name: Fetch UnRAR sources
        id: unrar-source
        uses: ./.github/actions/download-source
        with:
          url: https://www.rarlab.com/rar/unrarsrc-${{ env.UNRAR_VERSION }}.tar.gz
          sha256: ${{ env.UNRAR_SHA256 }}

      - name: Extract UnRAR sources
        env:
          SOURCE_ARCHIVE: ${{ steps.unrar-source.outputs.archive }}
        run: |
          mkdir unrarsrc
          tar -xzf "$SOURCE_ARCHIVE" -C unrarsrc --strip-components=1

      # 7-Zip's LZMA SDK is not part of the repository either (see README). It is a
      # .7z: bsdtar extracts it on macOS, 7-Zip elsewhere.
      - name: Fetch the LZMA SDK
        id: lzma-source
        uses: ./.github/actions/download-source
        with:
          url: ${{ env.LZMASDK_URL }}
          sha256: ${{ env.LZMASDK_SHA256 }}

      - name: Extract the LZMA SDK
        env:
          archive: ${{ steps.lzma-source.outputs.archive }}
        run: |
          mkdir lzmasdk
          if [ "$RUNNER_OS" = macOS ]; then
            tar -xf "${archive}" -C lzmasdk
          else
            7z x -bso0 -bsp0 -olzmasdk "${archive}"
          fi

      # libcurl is always built from source and linked statically (FTP only, no
      # TLS), so the binary depends on nothing that Windows does not ship.
      # FatFs is fetched manually for local builds; CI verifies the same zip.
      # CMake applies the official patches to a private build copy.
      - name: Fetch FatFs
        id: fatfs-source
        uses: ./.github/actions/download-source
        with:
          url: ${{ env.FATFS_URL }}
          sha256: ${{ env.FATFS_SHA256 }}

      - name: Extract FatFs
        env:
          SOURCE_ARCHIVE: ${{ steps.fatfs-source.outputs.archive }}
        run: |
          mkdir fatfs
          if [ "$RUNNER_OS" = Windows ]; then
            7z x -bso0 -bsp0 -ofatfs "$SOURCE_ARCHIVE"
          else
            unzip -q "$SOURCE_ARCHIVE" -d fatfs
          fi

      # Keep only downloaded archives; CMake verifies and extracts them afresh.
      - name: Cache CMake source archives
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/*-subbuild/*-populate-prefix/src/*.tar.*
            build/_ext/*/src/*.tar.*
          key: cmake-source-v1-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/LibArchive.cmake', 'tests/CMakeLists.txt') }}

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DSTREAMEXTRACT_BUNDLED_CURL=ON
          ${{ matrix.configure }}

      - name: Build
        run: cmake --build build --config Release

      - name: Unit tests
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Check dynamic dependencies
        run: |
          case "$RUNNER_OS" in
            Linux) ldd "build/${{ matrix.exe }}" ;;
            macOS) otool -L "build/${{ matrix.exe }}"; lipo -info "build/${{ matrix.exe }}" ;;
            *) echo "skipped" ;;
          esac

      - name: Stage files
        run: |
          mkdir dist
          cp "build/${{ matrix.exe }}" dist/
          cp LICENSE README.md THIRD_PARTY_NOTICES.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.name }}
          path: dist
          if-no-files-found: error

  gui:
    name: GUI (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            configure: >-
              -G Ninja
              -DCMAKE_SHARED_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
            tauri: --bundles appimage
          - name: linux-arm64
            os: ubuntu-22.04-arm
            configure: >-
              -G Ninja
              -DCMAKE_SHARED_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
            tauri: --bundles appimage
          - name: macos-universal
            os: macos-latest
            configure: >-
              -G Ninja
              "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
              -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri: --target universal-apple-darwin --bundles app
          - name: windows-x64
            os: windows-latest
            # Static CRT everywhere: no VC++ redistributable needed. Portable
            # build: StreamExtract.exe next to streamextractcore.dll, no installer.
            configure: >-
              -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
              -DCURL_STATIC_CRT=ON
            rustflags: -C target-feature=+crt-static
            tauri: --no-bundle
    defaults:
      run:
        shell: bash
    env:
      TAURI_CLI_VERSION: "2.12.1"
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build p7zip-full libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev file libfuse2

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Cargo source downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: cargo-source-v1-${{ runner.os }}-${{ env.TAURI_CLI_VERSION }}-${{ hashFiles('gui/src-tauri/Cargo.lock') }}
          restore-keys: cargo-source-v1-${{ runner.os }}-${{ env.TAURI_CLI_VERSION }}-

      - name: Cache tauri-cli
        id: tauri-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: tauri-cli-${{ env.TAURI_CLI_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install tauri-cli
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "${TAURI_CLI_VERSION}" --locked

      - name: Fetch UnRAR sources
        id: unrar-source
        uses: ./.github/actions/download-source
        with:
          url: https://www.rarlab.com/rar/unrarsrc-${{ env.UNRAR_VERSION }}.tar.gz
          sha256: ${{ env.UNRAR_SHA256 }}

      - name: Extract UnRAR sources
        env:
          SOURCE_ARCHIVE: ${{ steps.unrar-source.outputs.archive }}
        run: |
          mkdir unrarsrc
          tar -xzf "$SOURCE_ARCHIVE" -C unrarsrc --strip-components=1

      # 7-Zip's LZMA SDK is not part of the repository either (see README). It is a
      # .7z: bsdtar extracts it on macOS, 7-Zip elsewhere.
      - name: Fetch the LZMA SDK
        id: lzma-source
        uses: ./.github/actions/download-source
        with:
          url: ${{ env.LZMASDK_URL }}
          sha256: ${{ env.LZMASDK_SHA256 }}

      - name: Extract the LZMA SDK
        env:
          archive: ${{ steps.lzma-source.outputs.archive }}
        run: |
          mkdir lzmasdk
          if [ "$RUNNER_OS" = macOS ]; then
            tar -xf "${archive}" -C lzmasdk
          else
            7z x -bso0 -bsp0 -olzmasdk "${archive}"
          fi

      # FatFs is fetched manually for local builds; CI verifies the same zip.
      # CMake applies the official patches to a private build copy.
      - name: Fetch FatFs
        id: fatfs-source
        uses: ./.github/actions/download-source
        with:
          url: ${{ env.FATFS_URL }}
          sha256: ${{ env.FATFS_SHA256 }}

      - name: Extract FatFs
        env:
          SOURCE_ARCHIVE: ${{ steps.fatfs-source.outputs.archive }}
        run: |
          mkdir fatfs
          if [ "$RUNNER_OS" = Windows ]; then
            7z x -bso0 -bsp0 -ofatfs "$SOURCE_ARCHIVE"
          else
            unzip -q "$SOURCE_ARCHIVE" -d fatfs
          fi

      # Keep only downloaded archives; CMake verifies and extracts them afresh.
      - name: Cache CMake source archives
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/*-subbuild/*-populate-prefix/src/*.tar.*
            build/_ext/*/src/*.tar.*
          key: cmake-source-v1-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/LibArchive.cmake', 'tests/CMakeLists.txt') }}

      - name: Configure the library
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DSTREAMEXTRACT_BUNDLED_CURL=ON
          -DSTREAMEXTRACT_BUILD_LIBRARY=ON
          ${{ matrix.configure }}

      - name: Build the library
        run: cmake --build build --config Release --target streamextractcore streamextractcore_tests

      - name: Library tests
        run: ctest --test-dir build --build-config Release --output-on-failure -R capi

      - name: GUI tests
        working-directory: gui/src-tauri
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo test --locked

      - name: Build the GUI
        working-directory: gui
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          # Lets linuxdeploy resolve the library while it builds the AppImage.
          LD_LIBRARY_PATH: ${{ github.workspace }}/build
        run: cargo tauri build ${{ matrix.tauri }}

      - name: Stage files
        run: |
          mkdir dist
          case "${{ matrix.name }}" in
            linux-*)
              cp gui/src-tauri/target/release/bundle/appimage/*.AppImage dist/StreamExtract.AppImage
              chmod +x dist/StreamExtract.AppImage
              # The library must be inside the AppImage and resolvable from the executable.
              (cd dist && ./StreamExtract.AppImage --appimage-extract >/dev/null)
              ldd dist/squashfs-root/usr/bin/StreamExtract | tee /dev/stderr | grep -q "streamextractcore.so => .*squashfs-root"
              rm -rf dist/squashfs-root
              ;;
            macos-*)
              app=gui/src-tauri/target/universal-apple-darwin/release/bundle/macos/StreamExtract.app
              otool -L "$app/Contents/MacOS/StreamExtract" "$app/Contents/Frameworks/libstreamextractcore.dylib"
              lipo -info "$app/Contents/MacOS/StreamExtract" "$app/Contents/Frameworks/libstreamextractcore.dylib"
              codesign --verify --deep --strict "$app"
              cp -R "$app" dist/
              ;;
            windows-*)
              cp gui/src-tauri/target/release/StreamExtract.exe build/Release/streamextractcore.dll dist/
              ;;
          esac
          cp LICENSE README.md THIRD_PARTY_NOTICES.md dist/
          # A tarball keeps the executable bits and the .app layout through the artifact upload.
          tar -cf gui.tar -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.name }}
          path: gui.tar
          if-no-files-found: error

  package:
    name: Package .rar
    needs: [build, gui]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: bin

      - uses: actions/download-artifact@v4
        with:
          pattern: gui-*
          path: gui

      - name: Get the RAR archiver
        id: rar-source
        uses: ./.github/actions/download-source
        with:
          url: https://www.rarlab.com/rar/${{ env.RAR_ARCHIVE }}
          sha256: ${{ env.RAR_SHA256 }}

      - name: Extract the RAR archiver
        env:
          SOURCE_ARCHIVE: ${{ steps.rar-source.outputs.archive }}
        run: tar -xzf "$SOURCE_ARCHIVE"

      - name: Create archives
        run: |
          # Artifact download drops the executable bit.
          chmod +x bin/bin-linux-x64/sext bin/bin-linux-arm64/sext bin/bin-macos-universal/sext
          mkdir out
          for name in linux-x64 linux-arm64 macos-universal windows-x64; do
            (cd "bin/bin-${name}" && "$GITHUB_WORKSPACE/rar/rar" a -r -m5 -ma5 "$GITHUB_WORKSPACE/out/streamextract-cli-${name}.rar" .)
            mkdir "gui/${name}"
            tar -xf "gui/gui-${name}/gui.tar" -C "gui/${name}"
            (cd "gui/${name}" && "$GITHUB_WORKSPACE/rar/rar" a -r -m5 -ma5 "$GITHUB_WORKSPACE/out/streamextract-gui-${name}.rar" .)
          done
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: streamextract-linux-x64
          path: out/streamextract-cli-linux-x64.rar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: streamextract-linux-arm64
          path: out/streamextract-cli-linux-arm64.rar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: streamextract-macos-universal
          path: out/streamextract-cli-macos-universal.rar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: streamextract-windows-x64
          path: out/streamextract-cli-windows-x64.rar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: streamextract-gui-linux-x64
          path: out/streamextract-gui-linux-x64.rar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: streamextract-gui-linux-arm64
          path: out/streamextract-gui-linux-arm64.rar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: streamextract-gui-macos-universal
          path: out/streamextract-gui-macos-universal.rar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: streamextract-gui-windows-x64
          path: out/streamextract-gui-windows-x64.rar
          if-no-files-found: error
